services:
  synapse:
    image: ghcr.io/stevy2191/synapse:latest
    # To build from source instead of pulling, replace the line above with:  build: .
    container_name: synapse
    restart: unless-stopped
    ports:
      - "3001:3001"   # Change left port to expose on different host port
    volumes:
      - ./data:/data  # Persistent SQLite DB + uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/data
      # Optional: if unset, a random secret is generated and stored in ./data/.jwt_secret
      - JWT_SECRET=${JWT_SECRET:-}
      # Set to "true" to let anyone sign up. By default only the first user can register (as admin).
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}

# For Nginx Proxy Manager:
# - Set proxy host to: http://synapse:3001
# - No need to configure anything else — the app is proxy-aware
# - Enable Websockets if desired for future features
