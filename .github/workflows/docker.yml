name: Build and Push Docker Image

on:
  push:
    branches: [ main ]   # every update → :latest
    tags: [ 'v*' ]       # a release tag (e.g. v1.1.0) → an image with that version, to go back to if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/stevy2191/synapse:{0}', github.ref_name) || 'ghcr.io/stevy2191/synapse:latest' }}
